name: Check chiron kernel

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Download kernel source
        run: |
          git clone --depth=1 https://github.com/BYZYB/android_kernel_xiaomi_chiron.git kernel

      - name: Find configs
        run: |
          cd kernel
          find . -name "*defconfig" | head -50

      - name: Check APatch related options
        run: |
          cd kernel
          grep -R "CONFIG_KALLSYMS" . || true
          grep -R "CONFIG_LTO" . || true

      - name: Find chiron config
        run: |
          cd kernel
          find arch/arm64 -type f | grep -i chiron || true
          grep -R "chiron" arch/arm64/configs 2>/dev/null || true
          ls arch/arm64/configs | grep -i msm || true
