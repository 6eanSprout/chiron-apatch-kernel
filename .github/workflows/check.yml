name: Prepare chiron kernel

on:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        run: |
          git clone --depth=1 https://github.com/BYZYB/android_kernel_xiaomi_chiron.git kernel

      - name: Find device configs
        run: |
          cd kernel

          echo "=== chiron ==="
          find . -iname "*chiron*" || true

          echo "=== msm8998 ==="
          find arch/arm64/configs -iname "*msm8998*" || true

          echo "=== defconfigs ==="
          find arch/arm64/configs -type f | grep -E "8998|xiaomi|msm" || true

      - name: Kernel version
        run: |
          cd kernel
          make kernelversion
