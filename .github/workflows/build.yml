name: Build chiron kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kernel
        run: |
          git clone --depth=1 https://github.com/BYZYB/android_kernel_xiaomi_chiron.git kernel

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison flex libssl-dev build-essential clang lld llvm

      - name: Prepare config
        run: |
          cd kernel

          export ARCH=arm64

          make O=out chiron_defconfig

          echo "=== Disable problematic optimizations ==="

          scripts/config --disable LTO_CLANG
          scripts/config --disable LTO_CLANG_THIN
          scripts/config --disable PGO_CLANG
          scripts/config --disable BOLT
          scripts/config --disable MLGO

          scripts/config --enable KALLSYMS
          scripts/config --enable KALLSYMS_ALL

          make O=out olddefconfig

          grep -E "CONFIG_(LTO|PGO|BOLT|MLGO|KALLSYMS)" out/.config || true

      - name: Build kernel
        run: |
          cd kernel

          export ARCH=arm64

          make O=out \
          ARCH=arm64 \
          CROSS_COMPILE=aarch64-linux-gnu- \
          -j$(nproc)

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: chiron-kernel-test
          path: |
            kernel/out/arch/arm64/boot/Image*
